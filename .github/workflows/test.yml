name: Test manifest encoding
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Windows PowerShell 5.1 manifest writer
        shell: powershell
        run: .\scripts\tests\manifest-encoding.Tests.ps1
      - name: Verify PowerShell 7 manifest writer
        shell: pwsh
        run: .\scripts\tests\manifest-encoding.Tests.ps1
